[pytest]
pythonpath = tests
# Hardware tests submit real IBM jobs, so a token in the environment is not
# enough to opt into them: they are deselected unless asked for by name.
addopts = -m "not hardware"
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    hardware: submits a real job to IBM Quantum (select with -m hardware)
