# windbag: https://github.com/scale-venture-partners/windbag
# Rules not listed here run with windbag's defaults.

[windbag.ticket_id]
# Review and audit finding IDs (H9, M22, A1-04) and decision-record numbers
# (ADR-006) are the ticket IDs these repos use. The generic tracker shape is
# left out because it also matches cipher and standard names (AES-128).
pattern = '\b(?:[CHMP][0-9]{1,2}|[AB][1-3]-[0-9]{2}|ADR-[0-9]{3})\b'
