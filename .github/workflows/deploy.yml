name: Deploy to Railway

# A CLI upload gated on this repo's own CI, so production only ever holds a
# commit these checks validated. Railway's git integration builds on its own
# schedule and would ship ahead of them.
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-nonogram
  cancel-in-progress: false

jobs:
  deploy:
    # Deploys only when CI passed AND the run came from THIS repository. Without
    # the head_repository check a fork PR whose branch is named "main" satisfies
    # `branches: [main]` and this job, which holds RAILWAY_TOKEN, would upload
    # the fork's code. Manual runs are verified against the commit's CI history.
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event == 'push')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify CI passed for this commit (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'tests.yml', head_sha: context.sha, per_page: 20,
            });
            const ok = runs.data.workflow_runs.some((r) => r.conclusion === 'success');
            if (!ok) {
              core.setFailed(
                `No successful CI run for ${context.sha.slice(0, 7)} — manual deploys only ship CI-validated commits.`,
              );
            }

      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI validated; main may have moved on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install the Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        # RAILWAY_TOKEN is project-scoped, so it reaches this project only.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service nonogram --ci
