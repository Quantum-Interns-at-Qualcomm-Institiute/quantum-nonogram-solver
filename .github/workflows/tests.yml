name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # -c pins every runtime dependency to the lock for this Python, so a release
      # made today cannot change what CI tested yesterday. Dev tools resolve freely.
      - name: Install dependencies
        run: pip install -c requirements/py${{ matrix.python-version }}.lock -e ".[dev]"

      # Lint first — fast feedback, and it uses the ruff pinned by the [dev]
      # extra rather than a floating pip install.
      - name: Lint
        run: ruff check .

      # No -m here: a command-line -m replaces the deselection in pytest.ini
      # rather than adding to it, which would put the IBM tests back in CI.
      - name: Run tests
        run: pytest tests/ -v --tb=short

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -c requirements/py3.12.lock -e ".[dev]"

      - name: Boot nonogram and run the live-HTTP contract tests
        run: |
          # The guard runs as in production, with a throwaway secret for this run.
          export ORIGIN_SECRET="$(python -c 'import secrets; print(secrets.token_hex(16))')"
          PORT=5055 NONOGRAM_HOST=127.0.0.1 python -c "from tools.webapp import app, socketio; socketio.run(app, host='127.0.0.1', port=5055, allow_unsafe_werkzeug=True)" &
          curl --retry 60 --retry-delay 1 --retry-connrefused -sf http://127.0.0.1:5055/health
          NONOGRAM_URL=http://127.0.0.1:5055 NONOGRAM_ORIGIN_SECRET="$ORIGIN_SECRET" \
            python -m pytest tests/contract/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build .
